data_path: "../../data_all/"  # dataset root path
roi_size: [96,96,96]  # ROI size for spatial padding and cropping
in_channels: 1  # Number of input channels
pix_dim: [1.0,1.0,1.0]  # Pixel dimensions for Spacingd transform
num_samples: 4 # number of samples during random cropping
max_epochs: 200
max_iterations: 10000 # Maximum number of epochs for training
val_interval: 100  # Validation interval in epochs
batch_size: 2 # Batch size for training
lr: 0.0001 # Learning rate for the optimizer
